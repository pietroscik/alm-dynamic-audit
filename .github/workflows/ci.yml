name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Dataset invariants (core)
        run: python scripts/verify_dataset.py
      - name: Dataset invariants (lapse/backtest/curves 2023-26)
        run: python scripts/verify_new_datasets.py
      - name: Tests
        run: pytest tests/ -q
